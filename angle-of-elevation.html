<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Angle of Elevation Word Problems</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one guided card at a time with a part-by-part progress strip on top, CP2U7 trig practice. */
:root{
  --bg:#e8eeec; --paper:#f8fbfa; --ink:#1b2b2a; --muted:#566a68; --rule:#cbd8d5;
  --accent:#1f6b66; --accent-soft:#d6e9e6; --brass:#a87a1f; --brass-soft:#f4e7c6;
  --good:#2e7d4f; --good-soft:#dcefe3; --bad:#b33a3a; --bad-soft:#f6dede;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a19; --paper:#1a2524; --ink:#e2ecea; --muted:#97aba8; --rule:#2c3b39;
  --accent:#6cc4bb; --accent-soft:#1f3a37; --brass:#e0b45a; --brass-soft:#3a2f17;
  --good:#6fcf97; --good-soft:#18352a; --bad:#ef7b7b; --bad-soft:#3d1f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a19; --paper:#1a2524; --ink:#e2ecea; --muted:#97aba8; --rule:#2c3b39;
  --accent:#6cc4bb; --accent-soft:#1f3a37; --brass:#e0b45a; --brass-soft:#3a2f17;
  --good:#6fcf97; --good-soft:#18352a; --bad:#ef7b7b; --bad-soft:#3d1f1f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;line-height:1.1}
.top .sub{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1 1 360px;max-width:520px}
.progress button{width:100%;text-align:left;background:none;border:0;padding:4px 0;font:inherit;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.progress button:disabled{cursor:default;opacity:.55}
.progress button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.progress .bar{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress .lab{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress .cur .lab{color:var(--ink)}
.progress .cur .bar{outline:2px solid var(--brass);outline-offset:1px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
.card{padding:clamp(18px,3.4vw,34px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.3;margin:0;text-wrap:balance}
.card p{margin:0;max-width:65ch}
.math{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.card h2 .math{font-weight:600;font-size:.95em}
.muted{color:var(--muted)}
.tip{background:var(--brass-soft);border-radius:8px;padding:10px 14px;font-size:.95rem;max-width:65ch}
.rule{background:var(--accent-soft);border-radius:8px;padding:12px 16px;font-family:var(--f-mono);font-weight:600;font-size:1.05rem;overflow-x:auto}
.worked{margin:0;padding-left:1.3rem;display:grid;gap:8px}
.worked li::marker{color:var(--accent);font-weight:700}
.steps{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.step{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px;border-radius:10px;border:1px solid var(--rule)}
.step.active{border-color:var(--accent);background:var(--bg)}
.step .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font:700 .9rem var(--f-mono);background:var(--rule);color:var(--ink)}
.step.active .n{background:var(--accent);color:var(--paper)}
.step.done .n{background:var(--good);color:var(--paper)}
.step-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.step.coll{padding:0;display:block}
.qp{font-size:1.05rem;line-height:1.55;max-width:65ch}
.qp .math{font-weight:500}
.fns{display:grid;gap:4px;margin:8px 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px}
.fns{overflow-x:auto}.fns div{font-family:var(--f-mono);font-size:1rem;white-space:nowrap}
@media (max-width:520px){.fns{padding:6px 8px}.fns div{font-size:.86rem}.fns .fl{min-width:3.4em!important;font-size:.8rem!important}}
.fns .fl{font-family:var(--f-body);color:var(--muted);font-size:.9rem;display:inline-block;min-width:4.2em}
.bew{display:grid;gap:10px;border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--bg)}
.bew-sl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-weight:700}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.stog .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stog .arr,.shide{flex:none;font-size:1.1rem;color:var(--accent)}
.shide{align-self:flex-end;margin:-6px -4px -14px 0;background:none;border:0;cursor:pointer;padding:2px 6px;line-height:1;border-radius:6px;order:-1}
.step-text small{display:block;color:var(--muted);font-size:.85rem}
.tpl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:1.1rem}
.in{font-family:var(--f-mono);font-size:1.1rem;height:44px;width:4.6rem;padding:0 6px;border:2px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);text-align:center}
.in.wide{width:7rem}
.tpl.tight{gap:1px;font-size:.95rem}.tpl.tight .in{width:2.25rem;padding:0 1px;font-size:1rem}.tpl.tight.mid .in{width:3.1rem}.tpl.tight .in.wide{width:4.3rem}
@media (max-width:520px){.tpl .brk{flex-basis:100%;height:0}}

textarea.explain{width:100%;min-height:110px;font:inherit;padding:10px 12px;border:2px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}

.sample{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:.95rem}

.btn{font:700 .95rem var(--f-body);padding:11px 18px;border-radius:8px;border:2px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--accent)}
.btn.small{padding:7px 12px;font-size:.85rem}

.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--brass)}50%{box-shadow:0 0 0 6px transparent}}
.fb{margin:0;padding:10px 14px;border-radius:8px;font-size:.98rem;max-width:65ch}
.fb:empty{display:none}
.fb.good{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.show{background:var(--brass-soft);border-left:4px solid var(--brass)}
.final{font-family:var(--f-body);font-weight:600;font-size:1rem;background:var(--good-soft);border-radius:8px;padding:10px 14px;overflow-x:auto}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:16px}

.partdone strong{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.plan{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.plan li{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.plan .k{font:600 .75rem var(--f-mono);color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;flex:1 1 220px;max-width:340px}
.fields input{font:inherit;font-weight:400;height:44px;padding:0 12px;border:2px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.fields input:focus{outline:none;border-color:var(--accent)}
.rtitle{margin:0;font-family:var(--f-display);font-size:clamp(1.2rem,3vw,1.5rem);color:var(--accent)}
.rname{font-size:clamp(1.8rem,5vw,2.4rem)!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--bg)}
.stat .v{font:600 1.5rem var(--f-mono);font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.stat .l{font-size:.8rem;color:var(--muted)}
.rparts{display:grid;gap:12px}
.rpart{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--bg)}
.rpart h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rpart ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rpart li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem}
.rpart li span:first-child{min-width:0}
.rpart blockquote{margin:2px 0 6px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--paper);font-size:.9rem;border-radius:4px}
.pill{flex:none;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--rule);color:var(--ink);white-space:nowrap}
.pill.first{background:var(--good-soft);color:var(--good)}
.pill.hint{background:var(--brass-soft);color:var(--ink)}
.pill.shown{background:var(--bad-soft);color:var(--bad)}
.boxwrap{padding:2px}
.box{display:grid;grid-template-columns:auto repeat(2,minmax(0,1fr));gap:0;width:min(100%,340px)}
.box .lab .in{width:3.6rem}
.box .lab{padding:4px}
.box .lab{display:flex;align-items:center;justify-content:center;padding:6px;font-family:var(--f-mono);font-weight:600;font-size:1.1rem;color:var(--accent)}
.box .lab .in{border-color:var(--accent)}
.box .cell{display:flex;align-items:center;justify-content:center;height:clamp(54px,15vw,72px);min-width:0;border:2.5px solid var(--ink);margin:-1.25px;background:var(--paper);font-family:var(--f-mono);font-weight:600;font-size:1.15rem}
.box .cell .in{width:100%;min-width:0;height:100%;border:0;border-radius:0;background:transparent;font-size:1.05rem;padding:0 2px}
.box .cell .in:focus{background:var(--accent-soft)}
.box .cell.given{background:var(--accent-soft)}
.box .no,.box .cell.no{background:var(--bad-soft)!important}
.box .lab .in.no{border-color:var(--bad);background:var(--bad-soft)}
.box .cell.mid{background:var(--brass-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{font:600 1rem var(--f-mono);min-width:44px;height:38px;border-radius:8px;border:2px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.keys button:hover{border-color:var(--accent)}
.plotwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
@media (max-width:640px){.plotwrap{grid-template-columns:minmax(0,1fr)}}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-family:var(--f-mono);font-weight:600;padding:6px 8px;border-radius:8px;border:2px solid transparent}
.prow .pl{font-family:var(--f-body);font-weight:700;font-size:.85rem;flex-basis:100%;display:flex;align-items:center;gap:6px}
.prow .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.prow.sel{border-color:var(--accent);background:var(--accent-soft)}
.prow.no{border-color:var(--bad);background:var(--bad-soft)}
.prow .in{width:3.6rem;height:40px}
.plot svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:8px;touch-action:manipulation;cursor:crosshair}
.plot .gl{stroke:var(--rule);stroke-width:1}
.plot .ax{stroke:var(--ink);stroke-width:1.6}
.plot text{fill:var(--muted);font:11px var(--f-mono)}
.plot .curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.srt{display:inline-flex;align-items:flex-start;white-space:nowrap}
.srt>i{font-style:normal;font-size:1.15em;line-height:1;margin-right:-1px;transform:translateY(-.06em)}
.srt>span{border-top:1.6px solid currentColor;padding:1px 2px 0;line-height:1.2}
.sfr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 2px;text-align:center}
.sfr>span{padding:0 3px}
.sfr>span:first-child{border-bottom:1.5px solid currentColor}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}.step{grid-template-columns:minmax(0,1fr)}.step .n{display:none}.stog .n{display:grid}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}.progress .bar i{transition:none}}
.fig{max-width:420px;width:100%}
.fig svg,.ch svg{width:100%;height:auto;display:block}
.fig svg{background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.tri .edge{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linejoin:round}
.tri .fillt{fill:var(--accent-soft);stroke:none}
.tri text{font:600 15px var(--f-mono);fill:var(--ink)}
.tri text.given{fill:var(--accent)}
.tri text.want{fill:var(--brass);font-weight:700}
.tri text.vn{font:700 14px var(--f-body);fill:var(--muted)}
.tri text.word{font:600 13px var(--f-body);fill:var(--muted)}
.tri .arc{stroke:var(--brass);stroke-width:2;fill:none}
.tri .arc.ref{stroke-dasharray:4 3}
.tri .ra{stroke:var(--ink);stroke-width:1.5;fill:none}
.tri .gl{stroke:var(--rule);stroke-width:1}
.tri .ax{stroke:var(--ink);stroke-width:1.6}
.tri .term{stroke:var(--accent);stroke-width:2.6}
.tri .drop{stroke:var(--brass);stroke-width:2;stroke-dasharray:5 4}

.choices.pics{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.ch svg{max-width:260px;margin:0 auto}
.back{font-size:.85rem;color:var(--accent);text-decoration:none}
</style>

<script>
/* ======================= Shared engine ======================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* number formatting with a real minus sign */
const N=n=>{const v=Math.round(n*1e6)/1e6;return v<0?'−'+Math.abs(v):String(v)};
/* signed term: T(6,'x') -> "+ 6x", T(-1,'x') -> "− x", T(9,'') -> "+ 9" */
const T=(c,v='')=>{if(c===0)return '';const a=Math.abs(c),co=(a===1&&v)?'':String(Math.round(a*1e6)/1e6);return (c<0?'− ':'+ ')+co+v};
/* leading term without a plus sign */
const L=(c,v='')=>{const a=Math.abs(c),co=(a===1&&v)?'':String(a);return (c<0?'−':'')+co+v};
const M=s=>`<span class="math">${s}</span>`;
/* stacked fraction */
/* square root whose bar covers the whole radicand */
const SQ=x=>`<span class="srt"><i>√</i><span>${x}</span></span>`;
const SF=(top,bot)=>`<span class="sfr"><span>${top}</span><span>${bot}</span></span>`;
/* terms like x², −6x, 9 for the box (area model) */
function parseTerm(s){
  s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/\^2|²/g,'2').replace(/^\+/,'').toLowerCase();
  const m=s.match(/^(-?)(\d*\.?\d*)(x2?)?$/); if(!m||(!m[2]&&!m[3])) return null;
  const c=(m[1]?-1:1)*(m[2]?Number(m[2]):1); return {c,d:m[3]?(m[3]==='x2'?2:1):0};
}
function fmtTerm(c,d){if(c===0)return '0';const a=Math.abs(c),co=(a===1&&d)?'':N(a);return (c<0?'−':'')+co+(d===2?'x²':d===1?'x':'')}
const tEq=(a,b)=>a&&b&&(near(a.c,b.c)&&(a.c===0||a.d===b.d));
/* p1, p2 = the two middle boxes (numbers), c = the last term */
function combineStep({pre,p1,p2,c,text,ok}){
  const b=p1+p2, two=`${fmtTerm(p1,1)} + ${p2<0?'('+fmtTerm(p2,1)+')':fmtTerm(p2,1)}`;

  for(const m of (o.marks||[])){
    const p=V[m.at], nb=m.at==='P'?['R','Q']:['R','P'];
    const ua=un(sub(V[nb[0]],p)), ub=un(sub(V[nb[1]],p)), rad=26;
    const s=[p[0]+ua[0]*rad,p[1]+ua[1]*rad], e=[p[0]+ub[0]*rad,p[1]+ub[1]*rad], cr=ua[0]*ub[1]-ua[1]*ub[0];
    g+=`<path class="arc" d="M${f(s[0])} ${f(s[1])} A${rad} ${rad} 0 0 ${cr>0?1:0} ${f(e[0])} ${f(e[1])}"/>`;

function ptSVG(x,y,o={}){

  if(o.tri) g+=`<polygon class="fillt" points="${c},${c} ${f(X(x))},${c} ${f(X(x))},${f(Y(y))}"/><line class="drop" x1="${f(X(x))}" y1="${c}" x2="${f(X(x))}" y2="${f(Y(y))}"/>`;

    g+=`<text class="given" x="${f(bx)}" y="${f(by)}" text-anchor="middle" dominant-baseline="middle" style="font-size:13px">x = ${N(x)}</text>`;
    g+=`<text class="given" x="${f(X(x)+(x>0?7:-7))}" y="${f(Y(y/2))}" text-anchor="${x>0?'start':'end'}" dominant-baseline="middle" style="font-size:13px">y = ${N(y)}</text>`;

  if(s.type==='explain'){
    const t=($(`ex-${i}-${idx}`)||{}).value||'';
    const words=t.trim().split(/\s+/).filter(Boolean).length;
    if(words<(s.minWords||8)){setFb(r,`Write at least ${s.minWords||8} words. Explain it like you’re teaching a friend.`,'bad'); return render()}
    r.vals[idx]=t.trim(); r.explain=r.explain||{}; r.explain[idx]=t.trim();
    setFb(r,'Explanation saved. Compare it with the sample below.','good'); return finishStep(q,r);
  }
  if(s.type==='plot'){
    const v=readPlot(); r.draft=v;
    if(v.some(p=>!p||p[0].trim()===''||p[1].trim()==='')){setFb(r,'Fill in both numbers for every point.','bad'); return render()}
    const P=v.map(p=>[parseNum(p[0]),parseNum(p[1])]);
    const nb=P.findIndex(p=>isNaN(p[0])||isNaN(p[1])); if(nb>=0){r.bad=[nb]; setFb(r,'Type numbers only, like 3 or −25.','bad'); return render()}
    const bad=[]; const msgs=[];
    const groups={}; s.rows.forEach((rw,k)=>{if(rw.group){(groups[rw.group]=groups[rw.group]||[]).push(k)}});
    const used=new Set();
    s.rows.forEach((rw,k)=>{
      if(rw.group){ const pool=groups[rw.group].map(j=>s.rows[j].want).filter((w,j)=>!used.has(rw.group+j));
        const j=groups[rw.group].findIndex((jj,n)=>!used.has(rw.group+n)&&near(P[k][0],s.rows[jj].want[0])&&near(P[k][1],s.rows[jj].want[1]));
        if(j>=0){used.add(rw.group+j);return} }
      else if(near(P[k][0],rw.want[0])&&near(P[k][1],rw.want[1])) return;
      bad.push(k); const h=rw.hint&&rw.hint(P[k]); if(h&&!msgs.includes(h)) msgs.push(h);
    });
    if(!bad.length){r.vals[idx]=v; r.bad=[]; setFb(r,s.ok||'All of your points are right.','good'); return finishStep(q,r)}
    r.bad=bad; r.wrong++; r.sw++; r.sel=bad[0];
    setFb(r,msgs.join(' ')||'Check the red points.','bad'); save(); return render();
  }
  if(s.type==='box'){
    const v=readBox(); r.draft=v;
    if(Object.values(v).some(x=>x.trim()==='')){setFb(r,'Fill in every empty box first.','bad'); return render()}
    const t={}; for(const k in v){t[k]=parseTerm(v[k]); if(!t[k]){setFb(r,`“${esc(v[k])}” isn’t a term I can read. Type things like x, −3, x², −6x or 9.`,'bad'); r.bad=[k]; return render()}}
    const bad=[];
    const groups=(s.groups||[]).map(g=>g.filter(k=>k in s.want));
    const inGroup=new Set(groups.flat());
    for(const k in s.want){ if(!inGroup.has(k)&&!tEq(t[k],s.want[k])) bad.push(k) }
    for(const g of groups){
      const pool=g.map(k=>s.want[k]); const miss=[];
      for(const k of g){const j=pool.findIndex(w=>tEq(t[k],w)); if(j>=0) pool.splice(j,1); else miss.push(k)}
      bad.push(...miss);
    }
    let msg='';
    if(!bad.length&&s.consistent){
      const get=k=>k in t?t[k]:parseTerm(String(s.given[k]).replace(/^\+/,''));
      const mul=(a,b)=>a&&b?{c:a.c*b.c,d:a.d+b.d}:null;
      for(const [cell,top,side] of [['c00','top0','side0'],['c01','top1','side0'],['c10','top0','side1'],['c11','top1','side1']]){
        if(!tEq(get(cell),mul(get(top),get(side)))){bad.push(...[top,side,cell].filter(k=>k in t)); msg='Each inside box must equal its top label times its side label. Check the red ones.'}
      }
    }
    if(!bad.length){ r.vals[idx]=Object.fromEntries(Object.entries(t).map(([k,x])=>[k,fmtTerm(x.c,x.d)])); r.bad=[]; setFb(r,s.ok||'Every box checks out.','good'); return finishStep(q,r) }
    r.bad=[...new Set(bad.length?bad:Object.keys(s.want))]; r.wrong++; r.sw++;
    setFb(r,msg||(s.hint&&s.hint(t,r.bad))||'Check the red boxes. Each inside box is its top label times its side label.','bad'); save(); return render();
  }
  const vals=readBlanks(idx);
  r.draft=vals;
  if(vals.some(v=>v.trim()==='')){setFb(r,'Fill in every box first.','bad'); return render()}
  const nums=vals.map(parseNum);
  if(s.text_ok===undefined&&nums.some(isNaN)&&!s.raw){setFb(r,'Type numbers only, like 6, −4, 2.5 or 11/2.','bad'); return render()}
  const res=s.check?s.check(s.raw?vals:nums):defaultCheck(s,nums);
  if(res===true||(res&&res.ok)){
    r.vals[idx]=vals; setFb(r,s.quiet?'':((res&&res.msg)||s.ok||'Correct.'),'good'); return finishStep(q,r);
  }
  r.wrong++; r.sw++;
  setFb(r,(res&&res.hint)||(typeof res==='string'?res:'')||(s.hints?s.hints[Math.min(r.sw-1,s.hints.length-1)]:'Not quite. Try again.'),'bad');
  save(); render();
}
function defaultCheck(s,nums){
  if(s.ans.every((a,k)=>near(nums[k],a,s.tol||1e-6))) return true;
  if(s.hint){const h=s.hint(nums); if(h) return {hint:h}}
  return false;
}
function finishStep(q,r){
  const doneNow=advance(q,r); save(); render();
  if(doneNow){const [d,t]=partCounts(q.part); if(d===t) celebrate()}
}
function choose(oi){
  const i=st.i, q=S[i], r=rec(i), s=q.steps[r.step], o=s.options[oi];
  if(oi===s.correct){r.vals[r.step]=oi; setFb(r,o.why||s.ok||'Correct.','good'); return finishStep(q,r)}
  if(!r.bad.includes(oi)){r.bad.push(oi); r.wrong++; r.sw++}
  setFb(r,o.why||'Not quite. Try another.','bad'); save(); render();
}
function reveal(){
  const i=st.i, q=S[i], r=rec(i), s=q.steps[r.step];
  r.revealed=true;
  if(s.type==='choice'){r.vals[r.step]=s.correct; setFb(r,'The answer is: '+s.options[s.correct].t+'. '+(s.options[s.correct].why||''),'show')}
  else if(s.type==='plot'){r.vals[r.step]=s.rows.map(rw=>rw.want.map(N)); r.bad=[]; setFb(r,s.show||'Here are the points.','show')}
  else if(s.type==='box'){const o={};for(const k in s.want) o[k]=fmtTerm(s.want[k].c,s.want[k].d); r.vals[r.step]=o; r.bad=[]; setFb(r,s.show||'Here’s the filled-in box.','show')}
  else{const at=s.ansText||s.ans.map(N); r.vals[r.step]=at; setFb(r,(s.show||('Here it is: '+at.join(', ')+'.')),'show')}
  finishStep(q,r);
}

/* ---------- screens ---------- */
function introHTML(){
  const started=Object.keys(st.rec).length>0;
  return `<p class="eyebrow">${esc(APP.unit)}</p>
  <h2>${APP.heading}</h2>
  <p>${APP.intro}</p>
  <ol class="plan">${APP.parts.map((p,pi)=>`<li><span class="k">Part ${pi+1}</span><b>${esc(p.name)}</b><span class="muted">${partCounts(pi+1)[1]} problems</span></li>`).join('')}</ol>
  <div class="fields"><label for="nm">Your name<input id="nm" autocomplete="name" value="${esc(st.name)}"></label></div>
  <p class="fb bad" id="introErr" role="status"></p>
  <div class="row"><button class="btn" type="button" data-act="begin">${started?'Continue where I left off':'Start'}</button>
  ${started?`<button class="btn ghost" type="button" data-act="reset">Start over with new problems</button>`:''}</div>`;
}
function lessonHTML(s){
  const p=APP.parts[s.part-1];
  return `<p class="eyebrow">Part ${s.part} · ${esc(p.name)}</p>${p.lesson}`+nav(true,'Start the problems');
}
function status(r){if(!r||!r.done) return ['','not finished']; if(r.revealed) return ['shown','answer shown']; return r.wrong===0?['first','first try']:['hint',`correct after ${r.wrong} miss${r.wrong>1?'es':''}`]}
function minutes(){const end=st.end||Date.now();return st.start?Math.max(1,Math.round((end-st.start)/60000)):0}
function resultsHTML(){
  const all=QIDX.every(i=>st.rec[i]&&st.rec[i].done);
  if(all&&!st.end){st.end=Date.now(); save()}
  let first=0,hint=0,shown=0,left=0;
  QIDX.forEach(i=>{const [c]=status(st.rec[i]); if(c==='first')first++; else if(c==='hint')hint++; else if(c==='shown')shown++; else left++});
  const firstLeft=QIDX.find(i=>!(st.rec[i]&&st.rec[i].done));
  const when=new Date(st.end||Date.now()).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const parts=APP.parts.map((p,pi)=>`<section class="rpart"><h3>Part ${pi+1} · ${esc(p.name)}</h3><ul>${QIDX.filter(i=>S[i].part===pi+1).map((i,n)=>{
    const r=st.rec[i], [c,t]=status(r), q=S[i];
    const ex=r&&r.explain?Object.values(r.explain).map(x=>`<blockquote>${esc(x)}</blockquote>`).join(''):'';
    return `<li><span>${n+1}. ${q.label}</span><span class="pill ${c}">${t}</span></li>${ex}`}).join('')}</ul></section>`).join('');
  return `<p class="eyebrow">Results · ${esc(APP.unit)}</p>
  <p class="rtitle">${esc(APP.title)}</p>
  <h2 class="rname">${esc(st.name||'(no name)')}</h2>
  <p class="muted">${all?'Finished':'In progress'} ${when} · about ${minutes()} min</p>
  ${left?`<div class="tip">You still have ${left} problem${left>1?'s':''} left. <button class="btn small" type="button" data-go="${firstLeft}">Go to the next one</button></div>`:''}
  <div class="stats">
   <div class="stat"><span class="v">${first}/${QIDX.length}</span><span class="l">Correct on the first try</span></div>
   <div class="stat"><span class="v">${hint}</span><span class="l">Correct after a hint</span></div>
   <div class="stat"><span class="v">${shown}</span><span class="l">Answers shown</span></div>
  </div>
  <div class="rparts">${parts}</div>
  <div class="nav"><button class="btn ghost" type="button" data-act="back">Back</button><button class="btn ghost" type="button" data-act="again">Practice again with new numbers</button></div>`;
}
function render(){
  $('appTitle').textContent=APP.title; $('appSub').textContent=APP.unit;
  renderProgress();
  const s=S[st.i], card=$('card');
  if(s.kind==='intro') card.innerHTML=introHTML();
  else if(s.kind==='lesson'){card.innerHTML=lessonHTML(s); const lp=APP.parts[s.part-1]; if(lp.init) lp.init(card)}
  else if(s.kind==='results') card.innerHTML=resultsHTML();
  else card.innerHTML=qHTML(s,st.i);
  const f=card.querySelector('.step.active [data-pos]:placeholder-shown, .step.active .in, .step.active textarea, .step.active .ch');
  if(f&&s.kind==='q') setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},0);
}
function go(i){st.i=Math.max(0,Math.min(S.length-1,i)); st.max=Math.max(st.max,st.i); save(); render(); window.scrollTo({top:0})}
let armed=false;
$('card').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='next') go(st.i+1);
  else if(a==='back') go(st.i-1);
  else if(a==='check') submit();
  else if(a==='choice') choose(+b.dataset.o);
  else if(a==='reveal') reveal();
  else if(a==='tog'){OPEN[st.i+':'+b.dataset.k]=b.dataset.open!=='1'; render()}
  else if(a==='ins'){const inp=lastBox&&document.body.contains(lastBox)?lastBox:document.querySelector('.step.active [data-pos]'); if(inp){inp.value+=b.dataset.t; inp.focus(); rec(st.i).draft=readBox(); save()}}
  else if(a==='begin'){const v=$('nm').value.trim(); if(!v){$('introErr').textContent='Type your name so your teacher knows whose results these are.';return}
    st.name=v; if(!st.start) st.start=Date.now(); go(Object.keys(st.rec).length?Math.max(1,st.max):1)}
  else if(a==='reset'||a==='again'){
    if(!armed){armed=true;b.textContent='Tap again to erase your progress';return}
    const nm=st.name; st=fresh(); st.name=nm; armed=false; build(); save(); render();
  }
});
$('card').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('.step.active .in')){e.preventDefault();submit()}
  if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();$('card').querySelector('[data-act="begin"]').click()}
});
let lastBox=null;
function refreshPlot(){const q=S[st.i], r=rec(st.i), s=q.steps&&q.steps[r.step]; if(!s||s.type!=='plot') return;
  const el=document.querySelector('.step.active .plot'); if(el) el.innerHTML=plotSVG(s,readPlot(),false)}
function selRow(k){const r=rec(st.i); r.sel=k; document.querySelectorAll('.step.active .prow').forEach(x=>x.classList.toggle('sel',+x.dataset.row===k))}
$('card').addEventListener('focusin',e=>{if(e.target.matches('.step.active [data-xy]')) selRow(+e.target.dataset.row)});
$('card').addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('.step.active .plot svg'); if(!svg) return;
  const q=S[st.i], r=rec(st.i), s=q.steps[r.step]; const ctm=svg.getScreenCTM(); if(!ctm) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(ctm.inverse()), m=pmap(s.view);
  const x=Math.round(m.ix(p.x)), y=Math.round(m.iy(p.y)/ (s.view.snap||1))*(s.view.snap||1);
  const k=r.sel??0, ins=document.querySelectorAll(`.step.active [data-row="${k}"][data-xy]`);
  if(ins.length===2){ins[0].value=N(x); ins[1].value=N(y); r.draft=readPlot(); save(); refreshPlot();
    const nx=s.rows.findIndex((rw,j)=>j>k&&[...document.querySelectorAll(`.step.active [data-row="${j}"][data-xy]`)].some(i=>i.value.trim()===''));
    if(nx>=0) selRow(nx)}
});
$('card').addEventListener('focusin',e=>{if(e.target.matches('[data-pos]')) lastBox=e.target});
$('card').addEventListener('input',e=>{
  if(e.target.id==='nm'){st.name=e.target.value;save()}
  if(e.target.matches('.step.active [data-xy]')){const r=rec(st.i); r.draft=readPlot(); save(); refreshPlot()}
  else if(e.target.matches('.step.active [data-pos]')){rec(st.i).draft=readBox();save()}
  else if(e.target.matches('.step.active .in')){rec(st.i).draft=readBlanks();save()}
  if(e.target.matches('.step.active textarea')){const r=rec(st.i); r.vals[r.step]=e.target.value; save()}
});
$('progress').addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b&&!b.disabled) go(+b.dataset.go)});
let tt; function toast(m){const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2400)}
function celebrate(){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches) return}catch(e){}
  const cv=document.createElement('canvas'); cv.className='fx'; cv.setAttribute('aria-hidden','true'); document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight; cv.width=W*dpr; cv.height=H*dpr;
  const c=cv.getContext('2d'); c.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), cols=['--accent','--brass','--good','--bad'].map(v=>cs.getPropertyValue(v).trim()||'#a87a1f');
  const ps=[]; for(let b=0;b<6;b++){const x=W*(.15+Math.random()*.7),y=H*(.15+Math.random()*.35),col=cols[b%4],t0=b*220;
    for(let k=0;k<40;k++){const a=Math.PI*2*k/40,sp=2+Math.random()*3;ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t0,life:900+Math.random()*400,col})}}
  const start=performance.now();
  (function f(now){const t=now-start; c.clearRect(0,0,W,H); let alive=false;
    for(const p of ps){const age=t-p.t0; if(age<0){alive=true;continue} if(age>p.life) continue; alive=true;
      const s=age/16.7,k=(1-Math.pow(.95,s))/.05; c.globalAlpha=1-age/p.life; c.fillStyle=p.col; c.beginPath(); c.arc(p.x+p.vx*k,p.y+p.vy*k+.01*s*s,2.6,0,7); c.fill()}
    if(alive) requestAnimationFrame(f); else cv.remove()})(start);
}
if(!st.name) st.i=0;
render();
</script>
